apiVersion: v2
name: n8n
version: 2.1.1
appVersion: 2.36.8
type: application
description: "Helm Chart for deploying n8n on Kubernetes, a fair-code workflow
  automation platform with native AI capabilities for technical teams. Easily
  automate tasks across different services."
home: https://github.com/8gears/n8n-helm-chart
icon: https://avatars1.githubusercontent.com/u/45487711?s=200&v=4
keywords:
  - Workflow Automation
  - Workflow
  - iPaaS
  - integration-framework
  - low-code-plattform
  - low-code
sources:
  - https://github.com/n8n-io/n8n
  - https://n8n.io/
maintainers:
  - name: 8gears
    email: contact@8gears.com
    url: https://github.com/8gears
  - name: n8n
    email: _@8gears.com
    url: https://github.com/n8n-io

dependencies:
  - name: n8n-sandbox-service
    version: 0.6.3
    repository: oci://ghcr.io/n8n-io/n8n-sandbox-service
    condition: sandbox.deploy
  - name: valkey
    version: 0.8.1
    repository: https://valkey.io/valkey-helm/
    condition: valkey.enabled

annotations:
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: support
      url: https://github.com/8gears/n8n-helm-chart/issues
    - name: chart source
      url: https://github.com/8gears/n8n-helm-chart
    - name: n8n documentation
      url: https://docs.n8n.io/hosting/
    - name: n8n environment variables
      url: https://docs.n8n.io/hosting/configuration/environment-variables/
  # supported kinds are added, changed, deprecated, removed, fixed and security.
  artifacthub.io/changes: |
    - kind: added
      description: "Added an optional sandbox section that wires n8n to an n8n Sandbox Service, the isolated execution environment the instance-ai module needs"
    - kind: added
      description: "Added the upstream n8n-sandbox-service chart as an optional dependency, rendered when sandbox.deploy is true"
